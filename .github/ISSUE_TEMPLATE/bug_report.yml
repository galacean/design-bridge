name: Bug report
description: Report a reproducible conversion or tooling problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Report vulnerabilities privately using SECURITY.md. Include only inputs you have permission to share.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include diagnostics and representative images if rendering differs.
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package and version
      placeholder: '@galacean/svg2ir 1.0.0'
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the input, code, runtime versions, and command used to reproduce the issue.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include runtime, browser, and operating system details as relevant.
    validations:
      required: false
