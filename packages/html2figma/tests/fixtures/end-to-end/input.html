<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HTML to Figma end-to-end fixture</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f4f5f7;
        padding: 24px;
      }

      .card {
        display: flex;
        width: 320px;
        min-height: 148px;
        flex-direction: column;
        gap: 12px;
        padding: 20px;
        overflow: hidden;
        border: 1px solid #d7dce2;
        border-radius: 16px;
        background: linear-gradient(135deg, #ffffff 0%, #eaf4ff 100%);
        box-shadow: 0 8px 24px rgb(20 35 55 / 12%);
      }

      .heading {
        margin: 0;
        color: #152238;
        font-size: 24px;
        font-weight: 700;
        line-height: 30px;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .label {
        color: #526173;
        font-size: 14px;
        line-height: 20px;
      }

      .mark {
        width: 24px;
        height: 24px;
        color: #0878d1;
      }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script>
      document.querySelector('#root').innerHTML = `
        <article class="card" data-fixture="dynamic-card">
          <h1 class="heading">Design Bridge</h1>
          <div class="row">
            <span class="label">Rendered by Chromium</span>
            <svg class="mark" viewBox="0 0 24 24" aria-label="check">
              <path fill="currentColor" d="M9.2 16.2 4.8 11.8l-1.4 1.4L9.2 19 21 7.2l-1.4-1.4z" />
            </svg>
          </div>
        </article>
      `;
    </script>
  </body>
</html>
