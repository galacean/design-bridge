<!doctype html>
<html lang="en">
<meta charset="utf-8">
<style>
  @font-face { font-family: Inter; font-weight: 400; src: url('/__e2e/inter-latin-400-normal.woff2'); }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; display: grid; grid-template-columns: repeat(3, 180px); gap: 20px;
    background: white; font: 24px/32px Inter, sans-serif; }
  section { width: 180px; height: 120px; }
  .box { width: 160px; height: 100px; }
  #oklch-target { background: oklch(65% 0.18 35); }
  #lab-target { background: lab(60% 35 -45); }
  #p3-target { background: color(display-p3 0.1 0.7 0.3); }
  #alpha-target { background: oklch(65% 0.18 35 / 0.4); }
  #border-target { border: 8px solid oklch(60% 0.22 260); }
  #text-target { color: oklch(60% 0.24 320); margin: 0; }
  #label-target { display: inline-block; padding: 8px 12px; border-radius: 8px;
    color: color(srgb 1 1 1); background: oklch(65% 0.18 35); }
  #rgb-target { background: rgb(20, 80, 220); }
  #clear-target { background: oklch(65% 0.18 35 / 0); }
</style>
<section id="oklch"><div id="oklch-target" class="box"></div></section>
<section id="lab"><div id="lab-target" class="box"></div></section>
<section id="p3"><div id="p3-target" class="box"></div></section>
<section id="alpha"><div id="alpha-target" class="box"></div></section>
<section id="border"><div id="border-target" class="box"></div></section>
<section id="text"><p id="text-target">Modern CSS</p></section>
<section id="label"><span id="label-target">Color label</span></section>
<section id="rgb"><div id="rgb-target" class="box"></div></section>
<section id="clear"><div id="clear-target" class="box"></div></section>
</html>
