<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      @font-face { font-family: Inter; font-weight: 400; src: url('/__e2e/inter-latin-400-normal.woff2'); }
      @font-face { font-family: Inter; font-weight: 700; src: url('/__e2e/inter-latin-700-normal.woff2'); }
      body { margin: 0; font: 20px/32px Inter, sans-serif; }
      section { margin-bottom: 24px; width: 220px; }
      p { margin: 0; }
      #tracking { letter-spacing: -0.8px; }
      #center { text-align: center; }
      #bold { font-weight: 700; }
      #fallback { font-family: 'Absent Fixture Font', Inter, sans-serif; }
    </style>
  </head>
  <body>
    <section id="wrap"><p>Measure each row using browser positions and keep every word aligned.</p></section>
    <section id="tracking"><p>Measured text keeps the browser spacing.</p></section>
    <section id="center"><p>Centered words wrap onto several rows.</p></section>
    <section id="bold"><p>Bold text 700</p></section>
    <section id="fallback"><p>Fallback text uses the available font.</p></section>
  </body>
</html>
