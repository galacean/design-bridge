<!doctype html>
<html><head><meta charset="utf-8"><style>
  .card {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 24px;
    width: 320px;
    height: 180px;
    border: 1px solid rgb(226, 232, 240);
    border-radius: 16px;
    background: white;
    box-shadow: 0px 8px 24px 0px rgba(15, 23, 42, 0.12);
    color: rgb(17, 24, 39);
  }
  .card .title {
    font-size: 24px;
    font-weight: 700;
    line-height: 32px;
  }
  .description {
    font-size: 14px;
    line-height: 20px;
  }
</style></head><body>
  <article class="card">
    <h1 class="title">OpenPencil</h1>
    <p class="description">Design with code-shaped CSS.</p>
  </article>
</body></html>
