<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="300" height="300">
  <defs>
    <polygon id="star" points="150,50 180,140 100,80 200,80 120,140" fill="#faad14"/>
    <rect id="box" x="0" y="0" width="50" height="50" fill="#1677ff"/>
  </defs>
  <use xlink:href="#star" x="0" y="0"/>
  <use xlink:href="#star" x="50" y="50"/>
  <use xlink:href="#box" x="200" y="200"/>
</svg>