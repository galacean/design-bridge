<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300">
  <defs>
    <pattern id="p" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#000"/></pattern>
    <radialGradient id="rg" cx="50" cy="50" r="40" fx="80" fy="50"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <linearGradient id="lg" x1="0" y1="0" x2="100" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
  </defs>
  <rect x="10" y="10" width="50" height="50" fill="url(#p)"/>
  <circle cx="200" cy="50" r="30" fill="url(#rg)"/>
  <rect x="10" y="100" width="50" height="50" fill="url(#lg)"/>
  <rect x="10" y="200" width="50" height="50" fill="#1677ff"><animate attributeName="x" from="10" to="100" dur="1s"/></rect>
</svg>